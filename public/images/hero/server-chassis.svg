<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect width="800" height="600" fill="url(#chassisBg)" />

  <!-- Subtle Perspective Background Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.5">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Central Server Rack Unit Chassis (3D-feel enterprise storage array) -->
  <g transform="translate(100, 110)">
    <!-- Outer Metal Shell -->
    <rect x="0" y="0" width="600" height="360" rx="8" fill="url(#bezelGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Rack Mount Ears (Left & Right) -->
    <rect x="-24" y="20" width="24" height="70" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="-12" cy="40" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <circle cx="-12" cy="70" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />

    <rect x="600" y="20" width="24" height="70" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="612" cy="40" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <circle cx="612" cy="70" r="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />

    <!-- Top Bezel Ventilation Mesh -->
    <rect x="30" y="20" width="540" height="25" rx="3" fill="#090d16" stroke="#334155" stroke-width="1" />
    <g fill="#0ea5e9" opacity="0.6">
      <circle cx="50" cy="32" r="2" />
      <circle cx="70" cy="32" r="2" />
      <circle cx="90" cy="32" r="2" />
      <circle cx="110" cy="32" r="2" />
      <circle cx="130" cy="32" r="2" />
      <circle cx="530" cy="32" r="2.5" fill="#10b981" opacity="0.9" />
      <circle cx="550" cy="32" r="2.5" fill="#0ea5e9" opacity="0.9" />
    </g>

    <!-- Main Front Panel / Drive Bay Grid -->
    <rect x="30" y="60" width="540" height="260" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

    <!-- 12 Hot-Swap Drive Bays Grid (4 cols x 3 rows) -->
    <!-- Row 1 -->
    <g fill="#131b2e" stroke="#334155" stroke-width="1">
      <rect x="45" y="75" width="115" height="65" rx="2" />
      <rect x="175" y="75" width="115" height="65" rx="2" />
      <rect x="305" y="75" width="115" height="65" rx="2" />
      <rect x="435" y="75" width="115" height="65" rx="2" />

      <!-- Row 2 -->
      <rect x="45" y="155" width="115" height="65" rx="2" />
      <rect x="175" y="155" width="115" height="65" rx="2" />
      <rect x="305" y="155" width="115" height="65" rx="2" />
      <rect x="435" y="155" width="115" height="65" rx="2" />

      <!-- Row 3 -->
      <rect x="45" y="235" width="115" height="65" rx="2" />
      <rect x="175" y="235" width="115" height="65" rx="2" />
      <rect x="305" y="235" width="115" height="65" rx="2" />
      <rect x="435" y="235" width="115" height="65" rx="2" />
    </g>

    <!-- Drive Activity LEDs (Cyan & Emerald) -->
    <g fill="#0ea5e9">
      <circle cx="55" cy="85" r="2.5" opacity="0.9" />
      <circle cx="185" cy="85" r="2.5" opacity="0.8" />
      <circle cx="315" cy="85" r="2.5" fill="#10b981" opacity="0.9" />
      <circle cx="445" cy="85" r="2.5" opacity="0.9" />

      <circle cx="55" cy="165" r="2.5" opacity="0.7" />
      <circle cx="185" cy="165" r="2.5" fill="#10b981" opacity="0.9" />
      <circle cx="315" cy="165" r="2.5" opacity="0.8" />
      <circle cx="445" cy="165" r="2.5" opacity="0.9" />

      <circle cx="55" cy="245" r="2.5" fill="#10b981" opacity="0.9" />
      <circle cx="185" cy="245" r="2.5" opacity="0.8" />
      <circle cx="315" cy="245" r="2.5" opacity="0.9" />
      <circle cx="445" cy="245" r="2.5" fill="#10b981" opacity="0.9" />
    </g>

    <!-- Horizontal Light Strip across front (Hitachi Vantara styling accent) -->
    <rect x="30" y="55" width="540" height="2" fill="url(#ledGlow)" />
  </g>

  <!-- Ambient Floor Reflection Glow -->
  <ellipse cx="400" cy="500" rx="340" ry="30" fill="#0ea5e9" opacity="0.12" filter="blur(20px)" />
</svg>
