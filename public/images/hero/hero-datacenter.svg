<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gradCenter" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="serverGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Deep Dark Base -->
  <rect width="1920" height="1080" fill="#0b1120" />

  <!-- Grid Perspective Floor -->
  <rect width="1920" height="1080" fill="url(#gridPattern)" />

  <!-- Radial Depth Atmosphere -->
  <rect width="1920" height="1080" fill="url(#gradCenter)" />

  <!-- Data Center Rack Silhouette Silhouettes (Left & Right) -->
  <g opacity="0.35">
    <!-- Left Server Columns -->
    <rect x="60" y="120" width="120" height="800" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="220" y="100" width="120" height="840" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="380" y="80" width="130" height="880" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Blinking Server Lights on Left -->
    <circle cx="90" cy="180" r="3" fill="#0ea5e9" opacity="0.8" />
    <circle cx="110" cy="180" r="3" fill="#10b981" opacity="0.9" />
    <circle cx="130" cy="180" r="3" fill="#0ea5e9" opacity="0.6" />

    <circle cx="250" cy="160" r="3" fill="#10b981" opacity="0.9" />
    <circle cx="270" cy="160" r="3" fill="#0ea5e9" opacity="0.8" />

    <circle cx="410" cy="140" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="430" cy="140" r="3" fill="#10b981" opacity="0.9" />
    
    <!-- Right Server Columns -->
    <rect x="1740" y="120" width="120" height="800" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="1580" y="100" width="120" height="840" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="1410" y="80" width="130" height="880" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

    <!-- Blinking Server Lights on Right -->
    <circle cx="1770" cy="180" r="3" fill="#0ea5e9" opacity="0.8" />
    <circle cx="1790" cy="180" r="3" fill="#10b981" opacity="0.9" />
    
    <circle cx="1610" cy="160" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="1630" cy="160" r="3" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Glowing Horizontal Fiber Light Beams across the core -->
  <g opacity="0.25">
    <line x1="0" y1="280" x2="1920" y2="280" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="12, 8" />
    <line x1="0" y1="440" x2="1920" y2="440" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="24, 16" />
    <line x1="0" y1="560" x2="1920" y2="560" stroke="#10b981" stroke-width="0.8" stroke-dasharray="8, 12" />
  </g>

  <!-- Vignette Edge Gradients -->
  <rect width="1920" height="200" fill="url(#serverGlow)" opacity="0.2" />
</svg>
