<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Office / Studio Ambient Gradient -->
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Warm Window Light Ambient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Monitor Metallic Frame Gradient -->
    <linearGradient id="monitorFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Server Chassis Gradient -->
    <linearGradient id="serverChassisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cygnusa Sky / Cyan Chevron Glow Gradient -->
    <linearGradient id="skyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <filter id="monitorShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Environment (Modern Enterprise Workstation) -->
  <rect width="800" height="520" fill="url(#officeBg)" />
  <rect x="0" y="0" width="360" height="520" fill="url(#windowLight)" />

  <!-- Subtle Architectural Wall Lines -->
  <line x1="280" y1="0" x2="280" y2="440" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <line x1="0" y1="440" x2="800" y2="440" stroke="#94a3b8" stroke-width="2" />

  <!-- Office Desk Surface -->
  <rect x="0" y="440" width="800" height="80" fill="#f8fafc" />
  <rect x="0" y="440" width="800" height="4" fill="#e2e8f0" />

  <!-- Desk Accessories (Keyboard & Coffee Mug) -->
  <rect x="360" y="455" width="220" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
  <!-- Keyboard Keys Preview -->
  <g fill="#94a3b8" opacity="0.5">
    <rect x="372" y="460" width="18" height="6" rx="1" />
    <rect x="395" y="460" width="18" height="6" rx="1" />
    <rect x="418" y="460" width="18" height="6" rx="1" />
    <rect x="441" y="460" width="18" height="6" rx="1" />
    <rect x="464" y="460" width="18" height="6" rx="1" />
    <rect x="487" y="460" width="30" height="6" rx="1" />
    <rect x="372" y="470" width="28" height="6" rx="1" />
    <rect x="405" y="470" width="60" height="6" rx="1" />
    <rect x="470" y="470" width="47" height="6" rx="1" />
  </g>

  <!-- Ceramic Mug -->
  <rect x="620" y="448" width="28" height="34" rx="3" fill="#64748b" />
  <path d="M 648 456 Q 658 465 648 474" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

  <!-- ============================================================ -->
  <!-- LARGE ENTERPRISE MONITOR ON STAND                             -->
  <!-- ============================================================ -->
  <g filter="url(#monitorShadow)">
    <!-- Monitor Base & Stem -->
    <polygon points="460,455 510,455 490,400 480,400" fill="#475569" />
    <rect x="445" y="454" width="80" height="6" rx="3" fill="#334155" />

    <!-- Monitor Outer Frame (Sleek Slim Bezel) -->
    <rect x="270" y="75" width="430" height="330" rx="10" fill="url(#monitorFrame)" stroke="#334155" stroke-width="3" />

    <!-- Top Center Webcam -->
    <circle cx="485" cy="80" r="3.5" fill="#020617" />
    <circle cx="485" cy="80" r="1.5" fill="#38bdf8" opacity="0.8" />

    <!-- Inner Screen Area (Width: 418, Height: 310) -->
    <rect x="276" y="86" width="418" height="308" rx="6" fill="#ffffff" />

    <!-- Screen Left Half: White Presentation Slide -->
    <g transform="translate(286, 96)">
      <!-- Eyebrow text -->
      <text x="12" y="30" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0ea5e9" letter-spacing="0.5">CYGNUSA INFRASTRUCTURE</text>

      <!-- Main Headline matching reference photo -->
      <text x="12" y="65" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#0f172a" width="180">
        <tspan x="12" dy="0">Build Modern</tspan>
        <tspan x="12" dy="24">AI-Ready</tspan>
        <tspan x="12" dy="24">Infrastructure</tspan>
      </text>

      <!-- Subline in strike / italic reference -->
      <text x="12" y="160" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" font-style="italic">
        Without Starting Over
      </text>

      <!-- Decorative metrics badge on slide -->
      <rect x="12" y="195" width="150" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="26" cy="213" r="4" fill="#10b981" />
      <text x="36" y="217" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#334155">100% Data Availability</text>
    </g>

    <!-- Screen Right Half: Server Rack Chassis Unit (Dark Technical Array) -->
    <g transform="translate(485, 96)">
      <!-- Chassis Housing -->
      <rect x="0" y="12" width="195" height="270" rx="4" fill="url(#serverChassisBg)" stroke="#1e293b" stroke-width="1" />

      <!-- Top Vendor Badge -->
      <rect x="15" y="24" width="70" height="12" rx="2" fill="#0f172a" />
      <text x="22" y="33" font-family="Inter, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" letter-spacing="1">CYGNUSA</text>

      <!-- Server Blade Units (4 Vertically Stacked Drives with Sky Glowing Chevrons) -->
      <!-- Drive Bay 1 -->
      <g transform="translate(15, 46)">
        <rect x="0" y="0" width="165" height="48" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <line x1="8" y1="24" x2="60" y2="24" stroke="#475569" stroke-width="2" />
        <!-- Sky Glowing Chevrons -->
        <path d="M 85 14 L 98 24 L 85 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 108 14 L 121 24 L 108 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 131 14 L 144 24 L 131 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Status LEDs -->
        <circle cx="155" cy="14" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="24" r="2.5" fill="#0ea5e9" />
        <circle cx="155" cy="34" r="2.5" fill="#38bdf8" />
      </g>

      <!-- Drive Bay 2 -->
      <g transform="translate(15, 102)">
        <rect x="0" y="0" width="165" height="48" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <line x1="8" y1="24" x2="60" y2="24" stroke="#475569" stroke-width="2" />
        <!-- Sky Glowing Chevrons -->
        <path d="M 85 14 L 98 24 L 85 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 108 14 L 121 24 L 108 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 131 14 L 144 24 L 131 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="155" cy="14" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="24" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="34" r="2.5" fill="#0ea5e9" />
      </g>

      <!-- Drive Bay 3 -->
      <g transform="translate(15, 158)">
        <rect x="0" y="0" width="165" height="48" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <line x1="8" y1="24" x2="60" y2="24" stroke="#475569" stroke-width="2" />
        <path d="M 85 14 L 98 24 L 85 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 108 14 L 121 24 L 108 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 131 14 L 144 24 L 131 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="155" cy="14" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="24" r="2.5" fill="#38bdf8" />
        <circle cx="155" cy="34" r="2.5" fill="#22c55e" />
      </g>

      <!-- Drive Bay 4 -->
      <g transform="translate(15, 214)">
        <rect x="0" y="0" width="165" height="48" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <line x1="8" y1="24" x2="60" y2="24" stroke="#475569" stroke-width="2" />
        <path d="M 85 14 L 98 24 L 85 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 108 14 L 121 24 L 108 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 131 14 L 144 24 L 131 34" fill="none" stroke="url(#skyGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="155" cy="14" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="24" r="2.5" fill="#22c55e" />
        <circle cx="155" cy="34" r="2.5" fill="#22c55e" />
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- PROFESSIONAL ENGINEER FIGURE (Silhouette / Profile)           -->
  <!-- ============================================================ -->
  <g transform="translate(60, 140)">
    <!-- Shadow behind person -->
    <ellipse cx="140" cy="320" rx="80" ry="20" fill="#0f172a" opacity="0.15" />

    <!-- Body / Blazer Torso -->
    <path d="M 70 320 L 75 220 Q 95 195 135 190 Q 170 195 195 225 L 210 320 Z" fill="#1e293b" />
    
    <!-- White Shirt Collar -->
    <polygon points="125,190 145,215 135,230 115,200" fill="#f8fafc" />
    
    <!-- Neck -->
    <path d="M 125 155 L 145 155 L 142 195 L 125 195 Z" fill="#d97706" opacity="0.3" />
    <path d="M 125 155 L 145 155 L 142 195 L 125 195 Z" fill="#fcd34d" opacity="0.4" />

    <!-- Head Profile & Hair (Professional with Ponytail) -->
    <!-- Head Base -->
    <ellipse cx="138" cy="130" rx="28" ry="32" fill="#78350f" opacity="0.25" />
    
    <!-- Hair Volume (Back & Top) -->
    <path d="M 115 140 Q 105 110 125 90 Q 150 75 165 95 Q 175 115 165 145 Q 150 160 135 158 Q 120 155 115 140 Z" fill="#1e1b4b" />
    <!-- Ponytail / Hair knot at back -->
    <path d="M 108 125 Q 85 135 88 165 Q 98 185 112 170 Q 115 145 108 125 Z" fill="#1e1b4b" />
    
    <!-- Ear & Wireless Earbud (Matching screenshot) -->
    <ellipse cx="138" cy="135" rx="6" ry="9" fill="#fed7aa" />
    <!-- White wireless earbud -->
    <ellipse cx="140" cy="136" rx="3.5" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Forehead, Nose, Chin Profile looking toward the screen -->
    <path d="M 155 105 Q 165 115 168 124 L 175 128 L 166 135 L 168 144 Q 160 152 148 152" fill="#fed7aa" />
  </g>
</svg>